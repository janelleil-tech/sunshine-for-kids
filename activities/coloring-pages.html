<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coloring Pages | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .coloring-box {
      max-width: 850px;
      margin: 25px auto;
      padding: 20px;
      background: white;
      border-radius: 20px;
      text-align: center;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 15px 0;
    }

    .color {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #555;
      cursor: pointer;
    }

    #colorCanvas {
      width: 100%;
      max-width: 800px;
      height: auto;
      border: 2px solid #ccc;
      border-radius: 15px;
      background: white;
      touch-action: none;
    }

    button {
      padding: 9px 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <main class="category-page">

    <a class="back" href="../category-coloring.html">← Back to Coloring</a>

    <h1>🖍️ Coloring Pages</h1>

    <p class="tagline">
      Pick a color and have fun coloring!
    </p>

    <div class="coloring-box">

      <div class="tools">
        <button class="color" style="background:#ff5c5c;" onclick="chooseColor('#ff5c5c')"></button>
        <button class="color" style="background:#ffb347;" onclick="chooseColor('#ffb347')"></button>
        <button class="color" style="background:#ffe066;" onclick="chooseColor('#ffe066')"></button>
        <button class="color" style="background:#77dd77;" onclick="chooseColor('#77dd77')"></button>
        <button class="color" style="background:#66b3ff;" onclick="chooseColor('#66b3ff')"></button>
        <button class="color" style="background:#b19cd9;" onclick="chooseColor('#b19cd9')"></button>
        <button class="color" style="background:#ff9ed2;" onclick="chooseColor('#ff9ed2')"></button>
        <button class="color" style="background:#333;" onclick="chooseColor('#333')"></button>

        <button onclick="chooseEraser()">🧽 Eraser</button>
        <button onclick="clearCanvas()">🗑️ Clear</button>
      </div>

      <canvas id="colorCanvas" width="800" height="500"></canvas>

    </div>

  </main>

  <script>
    const canvas = document.getElementById("colorCanvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;
    let currentColor = "#ff5c5c";
    let erasing = false;

    function getPosition(event) {
      const rect = canvas.getBoundingClientRect();

      const touch = event.touches ? event.touches[0] : event;

      return {
        x: (touch.clientX - rect.left) * (canvas.width / rect.width),
        y: (touch.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDrawing(event) {
      event.preventDefault();
      drawing = true;

      const pos = getPosition(event);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(event) {
      if (!drawing) return;

      event.preventDefault();

      const pos = getPosition(event);

      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      ctx.strokeStyle = erasing ? "white" : currentColor;

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      drawing = false;
      ctx.beginPath();
    }

    function chooseColor(color) {
      currentColor = color;
      erasing = false;
    }

    function chooseEraser() {
      erasing = true;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    canvas.addEventListener("touchstart", startDrawing, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDrawing);
  </script>

</body>
</html>
