<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunshine Coloring Page | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .coloring-page {
      text-align: center;
    }

    .coloring-page h1 {
      font-family: "Patrick Hand", cursive;
      color: var(--orange);
      font-size: clamp(2.5rem, 7vw, 4rem);
      margin-bottom: 4px;
    }

    .prompt {
      font-size: 1.15rem;
      margin-bottom: 20px;
    }

    .coloring-area {
      position: relative;
      width: min(850px, 94vw);
      margin: 0 auto;
      background: white;
      border: 3px solid #F6E6C7;
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    #coloringImage {
      display: block;
      width: 100%;
      height: auto;
    }

    #coloringCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
    }

    .coloring-tools {
      width: min(850px, 94vw);
      margin: 18px auto;
      padding: 15px;
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow);

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .color-button {
      width: 40px;
      height: 40px;
      min-height: 40px;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #E8D6C8;
      cursor: pointer;
    }

    .color-button.selected {
      box-shadow:
        0 0 0 3px #5B3A32,
        0 0 0 5px white;
    }

    .tool-button {
      min-height: 42px;
      border: 2px solid #F0D8B8;
      border-radius: 12px;
      background: #fffaf2;
      padding: 7px 13px;
      font: inherit;
      color: var(--brown);
      cursor: pointer;
      font-weight: 600;
    }

    .tool-button:active,
    .color-button:active {
      transform: scale(.95);
    }

    .tip {
      color: #8B7169;
      font-size: .95rem;
    }
  </style>
</head>

<body class="activity-body">

  <main class="activity-page coloring-page">

    <a class="back" href="../category-coloring.html">
      ← Back to Coloring Sheets
    </a>

    <h1>☀️ Sunshine Coloring Page!</h1>

    <p class="prompt">
      Tap a color, then tap a space to fill it! 🖍️🌈
    </p>

    <div class="coloring-area">

      <!-- YOUR COLORING PAGE -->
      <img
        id="coloringImage"
        src="../images/sunshine-coloring-page.png"
        alt="Sunshine for Kids coloring page"
      >

      <!-- COLORING CANVAS -->
      <canvas id="coloringCanvas"></canvas>

    </div>

    <div class="coloring-tools">

      <button
        class="color-button selected"
        data-color="#F28C63"
        style="background:#F28C63;"
        aria-label="Orange">
      </button>

      <button
        class="color-button"
        data-color="#F6B5B5"
        style="background:#F6B5B5;"
        aria-label="Pink">
      </button>

      <button
        class="color-button"
        data-color="#FFD96A"
        style="background:#FFD96A;"
        aria-label="Yellow">
      </button>

      <button
        class="color-button"
        data-color="#A8D5BA"
        style="background:#A8D5BA;"
        aria-label="Green">
      </button>

      <button
        class="color-button"
        data-color="#8EC5E8"
        style="background:#8EC5E8;"
        aria-label="Blue">
      </button>

      <button
        class="color-button"
        data-color="#B9A7E0"
        style="background:#B9A7E0;"
        aria-label="Purple">
      </button>

      <button
        class="color-button"
        data-color="#5B3A32"
        style="background:#5B3A32;"
        aria-label="Brown">
      </button>

      <button id="eraser" class="tool-button">
        🧽 Eraser
      </button>

      <button id="clear" class="tool-button">
        🗑️ Clear
      </button>

    </div>

    <p class="tip">
      💡 Tap inside a section of the picture to color it!
    </p>

  </main>


  <script>

    const image = document.getElementById("coloringImage");
    const canvas = document.getElementById("coloringCanvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    let selectedColor = "#F28C63";
    let fillCanvas;
    let fillCtx;


    /*
      Create a hidden copy of the original coloring page.
      This lets the program detect the black outlines.
    */

    function setupCanvas() {

      const width = image.naturalWidth;
      const height = image.naturalHeight;

      if (!width || !height) return;

      canvas.width = width;
      canvas.height = height;

      fillCanvas = document.createElement("canvas");
      fillCanvas.width = width;
      fillCanvas.height = height;

      fillCtx = fillCanvas.getContext("2d", {
        willReadFrequently: true
      });

      fillCtx.clearRect(
        0,
        0,
        width,
        height
      );

    }


    image.addEventListener("load", setupCanvas);

    if (image.complete) {
      setupCanvas();
    }


    /*
      Convert the selected HEX color into RGB.
    */

    function hexToRgb(hex) {

      return {
        r: parseInt(hex.substring(1, 3), 16),
        g: parseInt(hex.substring(3, 5), 16),
        b: parseInt(hex.substring(5, 7), 16)
      };

    }


    /*
      The actual flood-fill function.
    */

    function floodFill(startX, startY, color) {

      const width = canvas.width;
      const height = canvas.height;

      const originalImage =
        imageCanvasData();

      const pixelIndex =
        (startY * width + startX) * 4;

      const startR =
        originalImage.data[pixelIndex];

      const startG =
        originalImage.data[pixelIndex + 1];

      const startB =
        originalImage.data[pixelIndex + 2];

      /*
        Don't fill very dark pixels.
        These are normally the black outlines.
      */

      if (
        startR < 80 &&
        startG < 80 &&
        startB < 80
      ) {
        return;
      }


      const target = {
        r: startR,
        g: startG,
        b: startB
      };


      const newColor = hexToRgb(color);


      if (
        Math.abs(target.r - newColor.r) < 5 &&
        Math.abs(target.g - newColor.g) < 5 &&
        Math.abs(target.b - newColor.b) < 5
      ) {
        return;
      }


      const queue = [];

      queue.push({
        x: startX,
        y: startY
      });


      const visited =
        new Uint8Array(width * height);


      while (queue.length > 0) {

        const point = queue.pop();

        const x = point.x;
        const y = point.y;

        if (
          x < 0 ||
          x >= width ||
          y < 0 ||
          y >= height
        ) {
          continue;
        }


        const index =
          y * width + x;


        if (visited[index]) {
          continue;
        }

        visited[index] = 1;


        const pixel =
          index * 4;


        const r =
          originalImage.data[pixel];

        const g =
          originalImage.data[pixel + 1];

        const b =
          originalImage.data[pixel + 2];


        /*
          Only fill pixels that are similar
          to the starting area.
        */

        const difference =
          Math.abs(r - target.r) +
          Math.abs(g - target.g) +
          Math.abs(b - target.b);


        if (difference > 100) {
          continue;
        }


        fillCtx.fillStyle =
          color;

        fillCtx.fillRect(
          x,
          y,
          1,
          1
        );


        queue.push({
          x: x + 1,
          y: y
        });

        queue.push({
          x: x - 1,
          y: y
        });

        queue.push({
          x: x,
          y: y + 1
        });

        queue.push({
          x: x,
          y: y - 1
        });

      }


      drawColoredLayer();

    }


    /*
      Get the original coloring-page pixels.
    */

    function imageCanvasData() {

      const temp =
        document.createElement("canvas");

      temp.width =
        image.naturalWidth;

      temp.height =
        image.naturalHeight;

      const tempCtx =
        temp.getContext("2d", {
          willReadFrequently: true
        });

      tempCtx.drawImage(
        image,
        0,
        0
      );

      return tempCtx.getImageData(
        0,
        0,
        temp.width,
        temp.height
      );

    }


    /*
      Put the colors underneath
      the original line-art image.
    */

    function drawColoredLayer() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        fillCanvas,
        0,
        0
      );

    }


    /*
      Find where the child tapped.
    */

    canvas.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        const rect =
          canvas.getBoundingClientRect();

        const scaleX =
          canvas.width / rect.width;

        const scaleY =
          canvas.height / rect.height;

        const x =
          Math.floor(
            (event.clientX - rect.left) *
            scaleX
          );

        const y =
          Math.floor(
            (event.clientY - rect.top) *
            scaleY
          );


        floodFill(
          x,
          y,
          selectedColor
        );

      }
    );


    /*
      Color buttons.
    */

    document
      .querySelectorAll(".color-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            selectedColor =
              button.dataset.color;

            document
              .querySelectorAll(".color-button")
              .forEach(b =>
                b.classList.remove("selected")
              );

            button.classList.add("selected");

          }
        );

      });


    /*
      Eraser.

      This removes the color from
      the selected section.
    */

    document
      .getElementById("eraser")
      .addEventListener(
        "click",
        () => {

          selectedColor = null;

          document
            .querySelectorAll(".color-button")
            .forEach(b =>
              b.classList.remove("selected")
            );

        }
      );


    /*
      Clear everything.
    */

    document
      .getElementById("clear")
      .addEventListener(
        "click",
        () => {

          fillCtx.clearRect(
            0,
            0,
            fillCanvas.width,
            fillCanvas.height
          );

          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

        }
      );

  </script>

</body>
</html>
