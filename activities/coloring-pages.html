<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bee Coloring Page | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .coloring-page {
      text-align: center;
    }

    .coloring-page h1 {
      font-family: "Patrick Hand", cursive;
      color: var(--orange);
      font-size: clamp(2.5rem, 7vw, 4rem);
      margin-bottom: 4px;
    }

    .prompt {
      font-size: 1.15rem;
      margin-bottom: 20px;
    }

    .coloring-area {
      position: relative;
      width: min(850px, 94vw);
      margin: 0 auto;
      background: white;
      border: 3px solid #F6E6C7;
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    #coloringImage {
      display: block;
      width: 100%;
      height: auto;
    }

    #coloringCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
    }

    .coloring-tools {
      width: min(850px, 94vw);
      margin: 18px auto;
      padding: 15px;
      background: white;
      border-radius: 20px;
      box-shadow: var(--shadow);

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .color-button {
      width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #E8D6C8;
      cursor: pointer;
    }

    .color-button.selected {
      box-shadow:
        0 0 0 3px #5B3A32,
        0 0 0 5px white;
    }

    .tool-button {
      min-height: 42px;
      border: 2px solid #F0D8B8;
      border-radius: 12px;
      background: #fffaf2;
      padding: 7px 13px;
      font: inherit;
      color: var(--brown);
      cursor: pointer;
      font-weight: 600;
    }

    .tool-button.selected {
      background: #F6E6C7;
    }
  </style>
</head>

<body class="activity-body">

  <main class="activity-page coloring-page">

    <a class="back" href="../category-coloring.html">
      ← Back to Coloring Sheets
    </a>

    <h1>🐝 Bee Coloring Page!</h1>

    <p class="prompt">
      Tap a color, then tap a space to fill it! 🖍️🌈
    </p>

    <div class="coloring-area">

      <img
        id="coloringImage"
        src="../images/Black and White Illustrated Bee Coloring Page.png"
        alt="Bee coloring page"
      >

      <canvas id="coloringCanvas"></canvas>

    </div>

    <div class="coloring-tools">

      <button class="color-button selected"
        data-color="#F28C63"
        style="background:#F28C63;"
        aria-label="Orange">
      </button>

      <button class="color-button"
        data-color="#F6B5B5"
        style="background:#F6B5B5;"
        aria-label="Pink">
      </button>

      <button class="color-button"
        data-color="#FFD96A"
        style="background:#FFD96A;"
        aria-label="Yellow">
      </button>

      <button class="color-button"
        data-color="#A8D5BA"
        style="background:#A8D5BA;"
        aria-label="Green">
      </button>

      <button class="color-button"
        data-color="#8EC5E8"
        style="background:#8EC5E8;"
        aria-label="Blue">
      </button>

      <button class="color-button"
        data-color="#B9A7E0"
        style="background:#B9A7E0;"
        aria-label="Purple">
      </button>

      <button class="color-button"
        data-color="#5B3A32"
        style="background:#5B3A32;"
        aria-label="Brown">
      </button>

      <button id="eraser" class="tool-button">
        🧽 Eraser
      </button>

      <button id="clear" class="tool-button">
        🗑️ Clear
      </button>

    </div>

  </main>

  <script>

    const image =
      document.getElementById("coloringImage");

    const canvas =
      document.getElementById("coloringCanvas");

    const ctx =
      canvas.getContext("2d");

    let selectedColor = "#F28C63";

    let fillCanvas;
    let fillCtx;

    let originalPixels;


    /* -------------------------
       SET UP THE COLORING PAGE
    ------------------------- */

    function setup() {

      const width = image.naturalWidth;
      const height = image.naturalHeight;

      canvas.width = width;
      canvas.height = height;

      fillCanvas =
        document.createElement("canvas");

      fillCanvas.width = width;
      fillCanvas.height = height;

      fillCtx =
        fillCanvas.getContext("2d");


      /*
        Make a hidden copy of the
        original black-and-white image.
      */

      const originalCanvas =
        document.createElement("canvas");

      originalCanvas.width = width;
      originalCanvas.height = height;

      const originalCtx =
        originalCanvas.getContext("2d");

      originalCtx.drawImage(
        image,
        0,
        0,
        width,
        height
      );

      originalPixels =
        originalCtx.getImageData(
          0,
          0,
          width,
          height
        );

    }


    image.addEventListener(
      "load",
      setup
    );


    if (image.complete) {
      setup();
    }


    /* -------------------------
       HEX → RGB
    ------------------------- */

    function hexToRgb(hex) {

      return {
        r: parseInt(hex.slice(1,3), 16),
        g: parseInt(hex.slice(3,5), 16),
        b: parseInt(hex.slice(5,7), 16)
      };

    }


    /* -------------------------
       IS THIS A BLACK OUTLINE?
    ------------------------- */

    function isOutline(r, g, b) {

      return (
        r < 110 &&
        g < 110 &&
        b < 110
      );

    }


    /* -------------------------
       FLOOD FILL
    ------------------------- */

    function floodFill(startX, startY) {

      if (!originalPixels) return;

      /*
        If the eraser is selected,
        remove the color from the
        tapped region.
      */

      const erasing =
        selectedColor === "ERASER";


      const width =
        canvas.width;

      const height =
        canvas.height;


      const startIndex =
        (startY * width + startX) * 4;


      const startR =
        originalPixels.data[startIndex];

      const startG =
        originalPixels.data[startIndex + 1];

      const startB =
        originalPixels.data[startIndex + 2];


      /*
        Don't fill the black outline.
      */

      if (
        isOutline(
          startR,
          startG,
          startB
        )
      ) {
        return;
      }


      const queue = [
        [startX, startY]
      ];


      const visited =
        new Uint8Array(
          width * height
        );


      while (queue.length > 0) {

        const [x, y] =
          queue.pop();


        if (
          x < 0 ||
          y < 0 ||
          x >= width ||
          y >= height
        ) {
          continue;
        }


        const index =
          y * width + x;


        if (visited[index]) {
          continue;
        }


        visited[index] = 1;


        const pixel =
          index * 4;


        const r =
          originalPixels.data[pixel];

        const g =
          originalPixels.data[pixel + 1];

        const b =
          originalPixels.data[pixel + 2];


        /*
          Stop at black outlines.
        */

        if (
          isOutline(r, g, b)
        ) {
          continue;
        }


        /*
          Don't cross into a very
          different color.
        */

        const difference =
          Math.abs(r - startR) +
          Math.abs(g - startG) +
          Math.abs(b - startB);


        if (difference > 120) {
          continue;
        }


        /*
          Either add the selected color
          or erase the existing color.
        */

        if (erasing) {

          fillCtx.clearRect(
            x,
            y,
            1,
            1
          );

        } else {

          fillCtx.fillStyle =
            selectedColor;

          fillCtx.fillRect(
            x,
            y,
            1,
            1
          );

        }


        queue.push([x + 1, y]);
        queue.push([x - 1, y]);
        queue.push([x, y + 1]);
        queue.push([x, y - 1]);

      }


      drawColors();

    }


    /* -------------------------
       SHOW COLORS
    ------------------------- */

    function drawColors() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        fillCanvas,
        0,
        0
      );

    }


    /* -------------------------
       WHEN A CHILD TAPS THE PAGE
    ------------------------- */

    canvas.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        const rect =
          canvas.getBoundingClientRect();


        const scaleX =
          canvas.width / rect.width;

        const scaleY =
          canvas.height / rect.height;


        const x =
          Math.floor(
            (event.clientX - rect.left)
            * scaleX
          );


        const y =
          Math.floor(
            (event.clientY - rect.top)
            * scaleY
          );


        floodFill(x, y);

      }
    );


    /* -------------------------
       COLOR BUTTONS
    ------------------------- */

    document
      .querySelectorAll(".color-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            selectedColor =
              button.dataset.color;


            document
              .querySelectorAll(".color-button")
              .forEach(b =>
                b.classList.remove(
                  "selected"
                )
              );


            button.classList.add(
              "selected"
            );


            document
              .getElementById("eraser")
              .classList.remove(
                "selected"
              );

          }
        );

      });


    /* -------------------------
       ERASER
    ------------------------- */

    document
      .getElementById("eraser")
      .addEventListener(
        "click",
        () => {

          selectedColor =
            "ERASER";


          document
            .querySelectorAll(".color-button")
            .forEach(b =>
              b.classList.remove(
                "selected"
              )
            );


          document
            .getElementById("eraser")
            .classList.add(
              "selected"
            );

        }
      );


    /* -------------------------
       CLEAR
    ------------------------- */

    document
      .getElementById("clear")
      .addEventListener(
        "click",
        () => {

          fillCtx.clearRect(
            0,
            0,
            fillCanvas.width,
            fillCanvas.height
          );


          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

        }
      );

  </script>

</body>
</html>
