<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Bunny Find Home | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .maze-page {
      text-align: center;
    }

    .maze-page h1 {
      font-family: "Patrick Hand", cursive;
      color: var(--orange);
      font-size: clamp(2.5rem, 7vw, 4.2rem);
      margin-bottom: 4px;
    }

    .instructions {
      font-size: 1.15rem;
      margin-bottom: 18px;
    }

    .maze-info {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .carrot-count,
    .maze-message {
      background: white;
      border-radius: 18px;
      padding: 10px 18px;
      box-shadow: var(--shadow);
      font-weight: 600;
    }

    .maze-wrapper {
      width: min(760px, 94vw);
      margin: 0 auto;
      padding: 14px;
      background: #FFFDF5;
      border: 4px solid #FFD96A;
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .maze-board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(11, 1fr);
      width: 100%;
      aspect-ratio: 15 / 11;
      background: #FFF9EC;
      border: 3px solid #F0D8B8;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wall {
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.25) 0 2px, transparent 3px),
        #F49A6A;
      border-radius: 5px;
      box-shadow: inset 0 -2px 0 rgba(91, 58, 50, .12);
    }

    .open {
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.55) 0 2px, transparent 3px),
        #FFF9EC;
    }

    .bunny,
    .carrot,
    .home {
      position: absolute;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(100% / 15);
      height: calc(100% / 11);
      font-size: clamp(1.15rem, 3.8vw, 2rem);
      pointer-events: none;
      transition: left .08s linear, top .08s linear;
    }

    .bunny {
      z-index: 30;
    }

    .carrot {
      z-index: 20;
    }

    .carrot.collected {
      opacity: 0;
      transform: scale(.5);
    }

    .home {
      z-index: 15;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      justify-content: center;
      gap: 7px;
      margin: 20px auto 10px;
    }

    .controls button {
      border: 2px solid #E8C89A;
      border-radius: 16px;
      background: white;
      font-size: 1.7rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #E8C89A;
      touch-action: manipulation;
    }

    .controls button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #E8C89A;
    }

    .up {
      grid-column: 2;
      grid-row: 1;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .down {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .maze-note {
      font-size: .95rem;
      color: #8B7169;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .maze-wrapper {
        padding: 9px;
      }

      .controls {
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(2, 52px);
      }
    }
  </style>

</head>

<body>

  <main class="activity-page maze-page">

  </main>

  <script>

    /*
      15 columns x 11 rows

      # = WALL
      . = OPEN PATH

      Bunny is only allowed to move onto "." cells.
    */

    const maze = [

      "###############",
      "#...#.........#",
      "#.#.#.#######.#",
      "#.#...#.....#.#",
      "#.#####.###.#.#",
      "#.....#...#...#",
      "#####.#.#.###.#",
      "#.....#.#.....#",
      "#.#####.#####.#",
      "#.............#",
      "###############"

    ];

    const rows = maze.length;
    const cols = maze[0].length;

    const board = document.getElementById("mazeBoard");
    const bunny = document.getElementById("bunny");
    const home = document.getElementById("home");

    const carrots = [
      document.getElementById("carrot1"),
      document.getElementById("carrot2"),
      document.getElementById("carrot3"),
      document.getElementById("carrot4"),
      document.getElementById("carrot5")
    ];

    const carrotCount = document.getElementById("carrotCount");
    const message = document.getElementById("message");

    /*
      Bunny's starting position.
    */
    let bunnyRow = 1;
    let bunnyCol = 1;

    /*
      Carrot locations.
      All locations are on open "." spaces.
    */
    const carrotLocations = [
      { row: 1, col: 3 },
      { row: 3, col: 5 },
      { row: 5, col: 9 },
      { row: 7, col: 5 },
      { row: 9, col: 11 }
    ];

    /*
      Bunny's home.
    */
    const homeLocation = {
      row: 9,
      col: 13
    };

    let collected = 0;


    /*
      CREATE MAZE CELLS
    */

    for (let row = 0; row < rows; row++) {

      for (let col = 0; col < cols; col++) {

        const cell = document.createElement("div");

        if (maze[row][col] === "#") {
          cell.className = "cell wall";
        } else {
          cell.className = "cell open";
        }

        board.appendChild(cell);

      }

    }


    /*
      POSITION AN OBJECT
    */

    function positionItem(item, row, col) {

      item.style.left =
        (col * (100 / cols)) + "%";

      item.style.top =
        (row * (100 / rows)) + "%";

    }


    /*
      PUT BUNNY, HOME AND CARROTS
      INTO THEIR STARTING POSITIONS
    */

    function placeObjects() {

      positionItem(
        bunny,
        bunnyRow,
        bunnyCol
      );

      positionItem(
        home,
        homeLocation.row,
        homeLocation.col
      );

      carrots.forEach((carrot, index) => {

        positionItem(
          carrot,
          carrotLocations[index].row,
          carrotLocations[index].col
        );

      });

    }


    /*
      COLLECT CARROTS
    */

    function collectCarrots() {

      carrots.forEach((carrot, index) => {

        if (carrot.classList.contains("collected")) {
          return;
        }

        const location =
          carrotLocations[index];

        if (
          bunnyRow === location.row &&
          bunnyCol === location.col
        ) {

          carrot.classList.add("collected");

          collected++;

          carrotCount.textContent =
            collected;

          if (collected < 5) {

            message.textContent =
              `Yay! ${5 - collected} carrots left! 🥕`;

          } else {

            message.textContent =
              "You got all 5! Now find Bunny's home! 🏠";

          }

        }

      });

    }


    /*
      CHECK WHETHER BUNNY REACHED HOME
    */

    function checkHome() {

      if (
        bunnyRow === homeLocation.row &&
        bunnyCol === homeLocation.col
      ) {

        if (collected === 5) {

          message.textContent =
            "🎉 You did it! Bunny is home!";

        } else {

          message.textContent =
            `Bunny needs ${5 - collected} more carrot${5 - collected === 1 ? "" : "s"}! 🥕`;

        }

      }

    }


    /*
      MOVE BUNNY
    */

    function move(direction) {

      let newRow = bunnyRow;
      let newCol = bunnyCol;


      if (direction === "up") {
        newRow--;
      }

      if (direction === "down") {
        newRow++;
      }

      if (direction === "left") {
        newCol--;
      }

      if (direction === "right") {
        newCol++;
      }


      /*
        IMPORTANT:

        Bunny can ONLY move when:

        1. The position is inside the maze.
        2. The destination is ".".

        "#" means WALL.

        Therefore Bunny CANNOT move through
        the orange walls.
      */

      const insideMaze =
        newRow >= 0 &&
        newRow < rows &&
        newCol >= 0 &&
        newCol < cols;

      if (!insideMaze) {
        return;
      }


      const destination =
        maze[newRow][newCol];


      if (destination !== ".") {
        return;
      }


      /*
        The move is allowed.
      */

      bunnyRow = newRow;
      bunnyCol = newCol;


      positionItem(
        bunny,
        bunnyRow,
        bunnyCol
      );


      collectCarrots();
      checkHome();

    }


    /*
      ARROW BUTTONS
    */

    document
      .querySelectorAll("[data-direction]")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            move(
              button.dataset.direction
            );

          }
        );

      });


    /*
      COMPUTER KEYBOARD ARROWS
    */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowUp" ||
          event.key === "ArrowDown" ||
          event.key === "ArrowLeft" ||
          event.key === "ArrowRight"
        ) {

          event.preventDefault();

        }


        if (event.key === "ArrowUp") {
          move("up");
        }

        if (event.key === "ArrowDown") {
          move("down");
        }

        if (event.key === "ArrowLeft") {
          move("left");
        }

        if (event.key === "ArrowRight") {
          move("right");
        }

      }
    );


    /*
      START THE MAZE
    */

    placeObjects();

  </script>

</body>
</html>
