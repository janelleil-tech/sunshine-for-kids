<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Your Mood | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .drawing-box {
      width: 100%;
      max-width: 850px;
      margin: 20px auto;
      text-align: center;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 15px 0;
    }

    .color-button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #555;
      cursor: pointer;
    }

    .tool-button {
      padding: 9px 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    #drawingCanvas {
      display: block;
      width: 100%;
      max-width: 800px;
      height: 500px;
      margin: 0 auto;
      border: 2px solid #ccc;
      border-radius: 15px;
      background: white;
      touch-action: none;
    }
  </style>
</head>

<body>

  <main class="category-page">

    <a class="back" href="../category-create.html">← Back</a>

    <h1>Draw Your Mood Today! 🎨</h1>

    <p class="tagline">
      Draw anything that shows how you're feeling!
    </p>

    <div class="drawing-box">

      <div class="tools">

        <button class="color-button" style="background:#ff5c5c" onclick="chooseColor('#ff5c5c')"></button>
        <button class="color-button" style="background:#ffb347" onclick="chooseColor('#ffb347')"></button>
        <button class="color-button" style="background:#ffe066" onclick="chooseColor('#ffe066')"></button>
        <button class="color-button" style="background:#77dd77" onclick="chooseColor('#77dd77')"></button>
        <button class="color-button" style="background:#66b3ff" onclick="chooseColor('#66b3ff')"></button>
        <button class="color-button" style="background:#b19cd9" onclick="chooseColor('#b19cd9')"></button>
        <button class="color-button" style="background:#ff9ed2" onclick="chooseColor('#ff9ed2')"></button>
        <button class="color-button" style="background:#333" onclick="chooseColor('#333')"></button>

        <button class="tool-button" onclick="chooseEraser()">🧽 Eraser</button>
        <button class="tool-button" onclick="clearCanvas()">🗑️ Clear</button>

      </div>

      <canvas id="drawingCanvas" width="800" height="500"></canvas>

    </div>

  </main>

  <script>
    const canvas = document.getElementById("drawingCanvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;
    let currentColor = "#ff5c5c";
    let erasing = false;

    function getPosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDrawing(event) {
      event.preventDefault();
      drawing = true;

      const position = getPosition(event);

      ctx.beginPath();
      ctx.moveTo(position.x, position.y);
    }

    function draw(event) {
      if (!drawing) return;

      event.preventDefault();

      const position = getPosition(event);

      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.globalCompositeOperation =
        erasing ? "destination-out" : "source-over";

      ctx.strokeStyle = currentColor;

      ctx.lineTo(position.x, position.y);
      ctx.stroke();
    }

    function stopDrawing() {
      drawing = false;
      ctx.beginPath();
      ctx.globalCompositeOperation = "source-over";
    }

    function chooseColor(color) {
      currentColor = color;
      erasing = false;
    }

    function chooseEraser() {
      erasing = true;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener("pointerdown", startDrawing);
    canvas.addEventListener("pointermove", draw);
    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);
    canvas.addEventListener("pointerleave", stopDrawing);
  </script>

</body>
</html>
