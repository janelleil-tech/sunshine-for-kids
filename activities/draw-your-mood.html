<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Your Mood | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .drawing-box {
      max-width: 850px;
      margin: 25px auto;
      padding: 20px;
      background: white;
      border-radius: 20px;
      text-align: center;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
    }

    .color {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #555;
      cursor: pointer;
      padding: 0;
    }

    #drawingCanvas {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
      margin: 0 auto;
      border: 2px solid #ccc;
      border-radius: 15px;
      background: white;
      touch-action: none;
    }

    .tool-button {
      padding: 9px 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <main class="category-page">

    <a class="back" href="../category-create.html">← Back</a>

    <h1>Draw Your Mood Today! 🎨</h1>

    <p class="tagline">
      Draw anything that shows how you're feeling!
    </p>

    <div class="drawing-box">

      <div class="tools">

        <button class="color" style="background:#ff5c5c;"
          onclick="chooseColor('#ff5c5c')"></button>

        <button class="color" style="background:#ffb347;"
          onclick="chooseColor('#ffb347')"></button>

        <button class="color" style="background:#ffe066;"
          onclick="chooseColor('#ffe066')"></button>

        <button class="color" style="background:#77dd77;"
          onclick="chooseColor('#77dd77')"></button>

        <button class="color" style="background:#66b3ff;"
          onclick="chooseColor('#66b3ff')"></button>

        <button class="color" style="background:#b19cd9;"
          onclick="chooseColor('#b19cd9')"></button>

        <button class="color" style="background:#ff9ed2;"
          onclick="chooseColor('#ff9ed2')"></button>

        <button class="color" style="background:#333;"
          onclick="chooseColor('#333')"></button>

        <button class="tool-button" onclick="chooseEraser()">🧽 Eraser</button>

        <button class="tool-button" onclick="clearCanvas()">🗑️ Clear</button>

      </div>

      <canvas
        id="drawingCanvas"
        width="800"
        height="500">
      </canvas>

    </div>

  </main>

  <script>
    const canvas = document.getElementById("drawingCanvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;
    let currentColor = "#ff5c5c";
    let erasing = false;

    function getPosition(event) {
      const rect = canvas.getBoundingClientRect();

      let clientX;
      let clientY;

      if (event.touches && event.touches.length > 0) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
      } else {
        clientX = event.clientX;
        clientY = event.clientY;
      }

      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDrawing(event) {
      event.preventDefault();

      drawing = true;

      const position = getPosition(event);

      ctx.beginPath();
      ctx.moveTo(position.x, position.y);
    }

    function draw(event) {
      if (!drawing) return;

      event.preventDefault();

      const position = getPosition(event);

      ctx.lineWidth = 12;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (erasing) {
        ctx.globalCompositeOperation = "destination-out";
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = currentColor;
      }

      ctx.lineTo(position.x, position.y);
      ctx.stroke();
    }

    function stopDrawing() {
      drawing = false;
      ctx.beginPath();
      ctx.globalCompositeOperation = "source-over";
    }

    function chooseColor(color) {
      currentColor = color;
      erasing = false;
    }

    function chooseEraser() {
      erasing = true;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    canvas.addEventListener("touchstart", startDrawing, {
      passive: false
    });

    canvas.addEventListener("touchmove", draw, {
      passive: false
    });

    canvas.addEventListener("touchend", stopDrawing);
  </script>

</body>
</html>
