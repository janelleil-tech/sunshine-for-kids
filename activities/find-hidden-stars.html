<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Hidden Stars | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .find-game {
      max-width: 900px;
      margin: 25px auto;
      padding: 20px;
      background: white;
      border-radius: 20px;
      text-align: center;
    }

    .emoji-picture {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 520px;
      margin: 20px auto;
      background: #f7fff2;
      border: 3px solid #ddd;
      border-radius: 20px;
      overflow: hidden;
    }

    .emoji {
      position: absolute;
      font-size: 30px;
      user-select: none;
    }

    .star {
      cursor: pointer;
      font-size: 25px;
      z-index: 5;
      transition: transform 0.2s, opacity 0.2s;
    }

    .star:hover {
      transform: scale(1.25);
    }

    .found {
      opacity: 0.25;
      transform: scale(1.4);
    }

    #message {
      font-weight: bold;
      font-size: 18px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="category-page">

    <a class="back" href="../category-find.html">← Back to Find</a>

    <h1>🔎 Find the Hidden Stars!</h1>

    <p class="tagline">
      There are 5 stars hiding in this busy scene. Can you find them all?
    </p>

    <div class="find-game">

      <div class="emoji-picture">

        <!-- Plants, animals, and hearts -->
        <span class="emoji" style="top:5%; left:4%;">🌿</span>
        <span class="emoji" style="top:13%; left:16%;">🐶</span>
        <span class="emoji" style="top:7%; left:29%;">🌸</span>
        <span class="emoji" style="top:15%; left:43%;">🐰</span>
        <span class="emoji" style="top:6%; left:58%;">🌱</span>
        <span class="emoji" style="top:13%; left:73%;">❤️</span>
        <span class="emoji" style="top:7%; left:87%;">🐱</span>

        <span class="emoji" style="top:27%; left:8%;">🌷</span>
        <span class="emoji" style="top:34%; left:19%;">🐻</span>
        <span class="emoji" style="top:25%; left:34%;">🍃</span>
        <span class="emoji" style="top:36%; left:48%;">🦋</span>
        <span class="emoji" style="top:26%; left:63%;">🌺</span>
        <span class="emoji" style="top:35%; left:78%;">🐸</span>
        <span class="emoji" style="top:27%; left:91%;">💚</span>

        <span class="emoji" style="top:49%; left:5%;">🐼</span>
        <span class="emoji" style="top:57%; left:17%;">🌻</span>
        <span class="emoji" style="top:47%; left:30%;">❤️</span>
        <span class="emoji" style="top:58%; left:43%;">🐹</span>
        <span class="emoji" style="top:48%; left:57%;">🌿</span>
        <span class="emoji" style="top:59%; left:72%;">🐨</span>
        <span class="emoji" style="top:49%; left:88%;">🌱</span>

        <span class="emoji" style="top:72%; left:9%;">🌸</span>
        <span class="emoji" style="top:81%; left:21%;">🦊</span>
        <span class="emoji" style="top:70%; left:36%;">🌷</span>
        <span class="emoji" style="top:83%; left:50%;">🐶</span>
        <span class="emoji" style="top:72%; left:64%;">🍃</span>
        <span class="emoji" style="top:82%; left:78%;">💗</span>
        <span class="emoji" style="top:72%; left:91%;">🐰</span>

        <!-- Hidden stars -->
        <span class="emoji star" style="top:19%; left:24%;" onclick="findStar(this)">⭐</span>
        <span class="emoji star" style="top:42%; left:84%;" onclick="findStar(this)">⭐</span>
        <span class="emoji star" style="top:63%; left:31%;" onclick="findStar(this)">⭐</span>
        <span class="emoji star" style="top:88%; left:61%;" onclick="findStar(this)">⭐</span>
        <span class="emoji star" style="top:52%; left:69%;" onclick="findStar(this)">⭐</span>

      </div>

      <p id="message">Stars found: 0 / 5 ⭐</p>

      <button onclick="resetGame()">🔄 Start Over</button>

    </div>

  </main>

  <script>
    let found = 0;

    function findStar(star) {
      if (star.classList.contains("found")) return;

      star.classList.add("found");
      found++;

      document.getElementById("message").textContent =
        "Stars found: " + found + " / 5 ⭐";

      if (found === 5) {
        document.getElementById("message").textContent =
          "🎉 You found all 5 stars! Amazing job!";
      }
    }

    function resetGame() {
      found = 0;

      document.getElementById("message").textContent =
        "Stars found: 0 / 5 ⭐";

      document.querySelectorAll(".star").forEach(function(star) {
        star.classList.remove("found");
      });
    }
  </script>

</body>
</html>
