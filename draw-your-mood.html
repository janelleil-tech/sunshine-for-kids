<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Draw Your Mood Today! | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="activity-body">
  <main class="activity-page">
    <a class="back" href="../category-create.html">← Back to activities</a>

    <div class="activity-header">
      <h1>☀️ Draw Your Mood Today!</h1>
      <p>Draw anything that shows how you're feeling today.</p>
    </div>

    <div class="paper">
      <div class="activity-prompt">
        <h2>How are you feeling today?</h2>
        <p>Use the space below to draw, doodle, or color!</p>
      </div>

      <canvas id="drawingCanvas" aria-label="Drawing area"></canvas>
    </div>

    <div class="drawing-tools">
      <label>Color <input id="colorPicker" type="color" value="#F28C63"></label>
      <label>Size
        <select id="brushSize">
          <option value="4">Small</option>
          <option value="8" selected>Medium</option>
          <option value="16">Large</option>
        </select>
      </label>
      <button id="undo">↩ Undo</button>
      <button id="clear">🗑 Clear</button>
    </div>

    <p class="privacy-note">
      Your drawing stays on this page and is not uploaded or shared by this activity.
    </p>
  </main>

  <script src="../drawing.js"></script>
</body>
</html>
