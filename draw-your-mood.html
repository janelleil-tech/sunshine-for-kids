<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Your Mood | Sunshine for Kids</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body class="activity-body">

  <main class="activity-page">

    <a class="back" href="../category-create.html">← Back to activities</a>

    <div class="activity-header">
      <h1>☀️ Draw Your Mood!</h1>
      <p>Draw anything that shows how you're feeling today.</p>
    </div>

    <div class="drawing-area">
      <canvas id="drawingCanvas"></canvas>
    </div>

    <div class="drawing-tools">

      <button class="color-button" data-color="#F28C63" style="background:#F28C63;"></button>
      <button class="color-button" data-color="#F6B5B5" style="background:#F6B5B5;"></button>
      <button class="color-button" data-color="#FFD96A" style="background:#FFD96A;"></button>
      <button class="color-button" data-color="#A8D5BA" style="background:#A8D5BA;"></button>
      <button class="color-button" data-color="#8EC5E8" style="background:#8EC5E8;"></button>
      <button class="color-button" data-color="#B9A7E0" style="background:#B9A7E0;"></button>
      <button class="color-button" data-color="#5B3A32" style="background:#5B3A32;"></button>

      <button id="eraser">⌫ Eraser</button>
      <button id="clear">🗑 Clear</button>

    </div>

  </main>

  <script src="../drawing.js"></script>

</body>
</html>
